# movies-infra: put the TMDB token into Key Vault (manual, one-off)
#
# Why a pipeline at all: the vault has no public endpoint, only the agent in
# the hub reaches it. Terraform does not manage this value, so the token never
# lands in code or in Terraform state.
#
# How (details in pipelines/README.md):
#   1. Edit -> Variables -> New variable: TMDB_READ_TOKEN = <token>,
#      [x] Keep this value secret -> OK -> Save.
#   2. Run pipeline.
#   3. Edit -> Variables -> delete TMDB_READ_TOKEN -> Save.

trigger: none
pr: none

pool:
  name: movies-pool

steps:
  - checkout: none

  - task: AzureCLI@2
    displayName: Write tmdb-read-token to Key Vault
    inputs:
      azureSubscription: sc-movies-azure # workload identity federation, no stored credential
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [ -z "${TOKEN:-}" ]; then
          echo "##vso[task.logissue type=error]TMDB_READ_TOKEN is empty: Edit -> Variables -> TMDB_READ_TOKEN (secret) -> Save, then run again."
          exit 1
        fi

        KV=$(az keyvault list -g rg-movies-app --query "[0].name" -o tsv)
        echo "Key Vault: $KV"

        az keyvault secret set \
          --vault-name "$KV" \
          --name tmdb-read-token \
          --value "$TOKEN" \
          --content-type "text/plain" \
          --expires "2027-06-30T00:00:00Z" \
          --query "{name:name, updated:attributes.updated, expires:attributes.expires}" \
          -o table
    env:
      TOKEN: $(TMDB_READ_TOKEN) # secret variables reach scripts only when mapped explicitly
